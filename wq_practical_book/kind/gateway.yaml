
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway-infra
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: default
    hostname: "*.internal.kind.test"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All   # in real clusters prefer Same or Selector
  - name: https
    hostname: "*.internal.kind.test"
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: wildcard-internal-kind-test-tls
    allowedRoutes:
      namespaces:
        from: All