---
commonLabels:
  stack: observability
  environment: lab
loki:
  # Need this for ingesting logs from OTEL collector via OTLP HTTP
  limits_config:
    allow_structured_metadata: true
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_ # Index Name prefix, will be suffixed with the date and time period, e.g. loki_index_20240401_000000
          period: 24h
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks   # the compressed log data
      rules_directory: /var/loki/rules     # alerting/recording rules (unused here)
  # It sets how Loki compresses log data before writing it to storage.
  ingester:
    chunk_encoding: snappy
  # this is for loki to trace it own work.
  # Only on when Tempo is enabled and tracing is enabled in Tempo. Otherwise, it is not needed.
  tracing:
    enabled: false
  # Loki splits each queries into multiple sub-queries and executes them in parallel. This setting controls how many sub-queries can be executed concurrently.
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 2
  pattern_ingester:
    enabled: true
  distributor:
    otlp_config:
      default_resource_attributes_as_index_labels:
        - service.name
        - service.namespace
        - deployment.environment
        - deployment.environment.name
        - cloud.region
        - cloud.availability_zone
        - k8s.cluster.name
        - k8s.namespace.name
        - k8s.container.name
        - container.name
        - k8s.replicaset.name      # drop this line too if you decided against it
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name


#gateway:
#  ingress:
#    enabled: true
#    hosts:
#      - host: FIXME
#        paths:
#          - path: /
#            pathType: Prefix

deploymentMode: Monolithic
singleBinary:
  replicas: 1
  resources:
    limits:
      cpu: 3
      memory: 4Gi
    requests:
      cpu: 2
      memory: 2Gi
  extraEnv:
    # Keep a little bit lower than memory limits
    - name: GOMEMLIMIT
      value: 3750MiB
  # only for demo purposes, in production you should enable persistence and use a PVC
  persistence:
    enabled: false 
chunksCache:
  # default is 500MB, with limited memory keep this smaller
  writebackSizeLimit: 10MB

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomGateway:
  replicas: 0
